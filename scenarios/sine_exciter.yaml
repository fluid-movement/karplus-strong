name: sine_exciter
description: >
  The sine exciter on its third harmonic, a burst of one period: a soft,
  pitched mallet. Still the string's pitch, not the exciter's.
pitch: D3
duration: 2s
exciter: sine
harmonic: 3
analysis: { from: 50ms, to: 1.5s }
assert:
  pitch_error_cents: { min: -1.0, max: 1.0 }
  peak: { min: 0.1, max: 1.0 }
  non_finite_samples: { max: 0 }
