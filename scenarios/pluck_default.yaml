name: pluck_default
description: >
  The module out of the box, plucked once at C4. The baseline every other
  scenario differs from: in tune, audible, inside full scale, free of DC.
pitch: C4
duration: 3s
analysis: { from: 50ms, to: 2s }
assert:
  pitch_error_cents: { min: -1.0, max: 1.0 }
  peak: { min: 0.15, max: 1.0 }
  dc_offset_dbfs: { max: -50 }
  non_finite_samples: { max: 0 }
