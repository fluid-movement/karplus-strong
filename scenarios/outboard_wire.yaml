name: outboard_wire
description: >
  A filter in the loop that passes everything: the string goes out through the
  SEND, back through the RETURN, and is in tune, because the cables' delay has
  been taken off the string. Measured at C3: -0.8 cents, t60 1.99 s.
pitch: C3
duration: 3s
outboard: { lowpass_hz: 20000 }
params: { key_track: 1, decay: 0.5 }
analysis: { from: 50ms, to: 2.5s }
assert:
  pitch_error_cents: { min: -1.5, max: 1.5 }
  t60_s: { min: 1.6, max: 2.4 }
  peak: { min: 0.15, max: 1.0 }
  non_finite_samples: { max: 0 }
