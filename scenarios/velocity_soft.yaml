name: velocity_soft
description: >
  A quarter velocity: 2.5 V at the VEL jack. The burst is a quarter the
  size, so twelve decibels down on pluck_default's peak.
pitch: C4
duration: 1s
plucks: [{ at: 0s, velocity: 2.5 }]
assert:
  peak: { min: 0.2, max: 0.26 }
  pitch_error_cents: { min: -1.0, max: 1.0 }
