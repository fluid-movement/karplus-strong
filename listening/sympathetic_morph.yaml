name: sympathetic_morph
description: >
  SCENE sweeping through all six tunings while they ring (octaves and fifths,
  major, minor seventh, raga, tanpura, cluster). The strings should glide
  between tunings without a click; the flat stretches at each tuning should
  be easy to land on.
pitch: C3
duration: 16s
params: { decay: 0.5, sym_level: 1.0, sym_decay: 1.0 }
automation:
  sym_scene: { from: 0, to: 1, over: 16s }
plucks: [0s, 2.5s, 5s, 7.5s, 10s, 12.5s]
assert:
  non_finite_samples: { max: 0 }
  peak: { min: 0.05, max: 1.0 }
