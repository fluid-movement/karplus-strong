name: tension_chirp
description: >
  A hard pluck with tension modulation up begins sharp and falls. Measured at
  C4 over 100-250 ms: +14 cents. The opposing constraint is `tension_settles`
  (the same string ends in tune) and `pluck_default` (with the knob down it
  never chirps).
pitch: C4
duration: 3s
params: { tension: 1.0, decay: 0.8, key_track: 1 }
analysis: { from: 100ms, to: 250ms }
assert:
  pitch_error_cents: { min: 8, max: 60 }
  peak: { min: 0.15, max: 1.0 }
  non_finite_samples: { max: 0 }
