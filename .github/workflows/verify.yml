name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  JUST_VERSION: "1.58.0"

jobs:
  verify:
    name: just verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Fathom is a private repository and a git dependency (docs/decisions.md,
      # K2). Without a token that can read it, nothing here can build, so the
      # job says so and stops rather than failing on every push.
      - name: Access to Fathom
        id: fathom
        env:
          TOKEN: ${{ secrets.FATHOM_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::FATHOM_READ_TOKEN is not set; skipping. See TODO.md."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config --global url."https://x-access-token:${TOKEN}@github.com/fluid-movement/Fathom".insteadOf "https://github.com/fluid-movement/Fathom"

      - name: Install tools
        if: steps.fathom.outputs.skip != 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar -xz -C /usr/local/bin just
          just --version

      - name: Install Rust
        if: steps.fathom.outputs.skip != 'true'
        run: rustup show active-toolchain || rustup toolchain install

      - name: Verify
        if: steps.fathom.outputs.skip != 'true'
        run: just verify
