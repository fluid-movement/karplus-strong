language = "C"
header = """
/*
 * karplus.h — the C ABI of karplus-core.
 *
 * GENERATED BY cbindgen. DO NOT EDIT.
 *
 * Regenerate with `just header`. `just verify` fails if this file and
 * crates/karplus-ffi/src/lib.rs have drifted apart, so the two sides of the
 * boundary cannot disagree without CI noticing.
 */
"""
include_guard = "KARPLUS_H"
cpp_compat = true
documentation = true
documentation_style = "doxy"
style = "type"
usize_is_size_t = true

[export]
prefix = ""

[enum]
prefix_with_name = true
