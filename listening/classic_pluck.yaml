name: classic_pluck
description: >
  The module as it ships, a little melody of single plucks. The reference
  everything else is heard against.
duration: 6s
automation:
  pitch_volts: { from: -1.0, to: -0.4167, over: 1ms, start: 1.5s }
plucks: [0s, 750ms, 1.5s, 2.25s, 3s]
assert:
  non_finite_samples: { max: 0 }
  peak: { min: 0.1, max: 1.0 }
