name: harpsichord_bright
description: >
  Fully bright, plucked right at the bridge, with a short burst. The
  harshest pluck the module makes; listen for whether it is bright or just
  brittle.
pitch: A3
duration: 4s
params: { brightness: 1.0, pick: 0.1, length: 0.45, decay: 0.6 }
plucks: [0s, 500ms, 1s, 1.5s]
assert:
  non_finite_samples: { max: 0 }
  peak: { min: 0.1, max: 1.0 }
