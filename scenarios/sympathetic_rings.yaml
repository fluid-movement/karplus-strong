name: sympathetic_rings
description: >
  A short pluck at C4 with the sympathetic strings listening, in the major
  tuning: after the string has gone they are still ringing. The opposing
  constraint is `sympathetic_off_is_silent`.
pitch: C4
duration: 4s
params: { decay: 0.3, sym_level: 1.0, sym_scene: 0.2, sym_decay: 0.8 }
analysis: { from: 600ms, to: 3s }
assert:
  rms_dbfs: { min: -70, max: -20 }
  non_finite_samples: { max: 0 }
