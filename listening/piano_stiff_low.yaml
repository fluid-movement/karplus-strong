name: piano_stiff_low
description: >
  STIFFNESS at 0, 0.4, 0.7, 1.0 in turn (one pluck each, automated). Listen
  for the partials leaving the harmonic series: first a slight shimmer, then
  a piano's bright, slightly sour bass, then a bar or a bell. Check it stays
  in tune at the fundamental throughout.
pitch: C2
duration: 12s
params: { decay: 0.8, brightness: 0.8, key_track: 1 }
automation:
  stiffness: { from: 0, to: 1, over: 12s }
plucks: [0s, 3s, 6s, 9s]
assert:
  non_finite_samples: { max: 0 }
  peak: { min: 0.1, max: 1.0 }
