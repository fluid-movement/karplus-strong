name: body_shapes
description: >
  The body, SHAPE sweeping harmonic - bar - drum - plate over one long wash,
  plucked every 1.5 s, with the body fixed in Hz and a middling material.
  Listen for the body's own pitches: harmonic is a hollow tube, the bar
  clangs, the drum thumps and blooms, the plate is dense.
pitch: C3
duration: 12s
params: { decay: 0.3, body_mix: 0.7, body_material: 0.6, body_size: 0.4 }
automation:
  body_shape: { from: 0, to: 1, over: 12s }
plucks: [0s, 1.5s, 3s, 4.5s, 6s, 7.5s, 9s, 10.5s]
assert:
  non_finite_samples: { max: 0 }
  peak: { min: 0.1, max: 1.0 }
